name: security

on:
  workflow_call:
    inputs:
      run_fuzz:
        description: Run the bounded protocol fuzzing gate for this invocation
        required: false
        default: false
        type: boolean
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches:
      - "**"
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "fuzz/**"
      - "deny.toml"
      - ".gitleaks.toml"
      - ".github/octa-source-revision"
      - ".github/actions/checkout-octa/action.yml"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Install pinned dependency scanners
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Audit locked dependencies and licenses
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 >/dev/null
          cargo audit
          cargo audit --file fuzz/Cargo.lock
          cargo deny --locked check licenses sources
          cargo deny --locked --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check licenses sources
        working-directory: octacity
      - name: Reject committed secrets in release sources
        run: |
          gitleaks dir --config octacity/.gitleaks.toml --redact --no-banner --no-color octacity
          gitleaks dir --config octacity/.gitleaks.toml --redact --no-banner --no-color octa

  fuzz-protocols:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.run_fuzz == true
    runs-on: ubuntu-24.04
    env:
      # The workspace pins stable Rust, while cargo-fuzz requires nightly for
      # sanitizer and coverage instrumentation. A job-level rustup override is
      # inherited by cargo-fuzz and the cargo/rustc processes it starts.
      RUSTUP_TOOLCHAIN: nightly-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, pinned nightly
        with:
          toolchain: nightly-2026-10-01
      - name: Install build and fuzz tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc,cargo-fuzz@0.13.2
          fallback: cargo-install
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Fuzz bounded protocol decoders
        working-directory: octacity
        run: |
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 >/dev/null
          cargo fuzz run server-agent-json -- -max_total_time=30
          cargo fuzz run runner-json -- -max_total_time=30
          cargo fuzz run source-plugin -- -max_total_time=30
          cargo fuzz run server-protocols -- -max_total_time=30

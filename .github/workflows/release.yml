name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  portable-release-gate:
    uses: ./.github/workflows/ci.yml

  security-release-gate:
    uses: ./.github/workflows/security.yml
    with:
      run_fuzz: true

  backend-release-gate:
    uses: ./.github/workflows/backend-contracts.yml
    with:
      cadence: release
    secrets:
      OCTACITY_RUNNER_INVENTORY_TOKEN: ${{ secrets.OCTACITY_RUNNER_INVENTORY_TOKEN }}

  package:
    needs:
      - portable-release-gate
      - security-release-gate
      - backend-release-gate
    name: package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            target: x86_64-unknown-linux-gnu
            extension: ""
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            extension: ""
            archive: tar.gz
          - runner: windows-2025
            platform: windows-amd64
            target: x86_64-pc-windows-msvc
            extension: .exe
            archive: zip
          - runner: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
            extension: ""
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - name: Validate pinned Octa release contract
        shell: bash
        run: python3 octacity/tools/validate_octa_release_contract.py octa/.github/release-contract.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - name: Install protobuf compiler
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Build server, Agent, and source plugin
        working-directory: octacity
        env:
          OCTACITY_BUILD_COMMIT: ${{ github.sha }}
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          -p octacity-agent -p octacity-server -p octacity-source-git
      - name: Package deterministic release
        shell: bash
        working-directory: octacity
        env:
          OCTA_SOURCE_REVISION: ${{ steps.octa-source.outputs.revision }}
        run: |
          mkdir -p dist
          SOURCE_METADATA=source-plugin-package.json
          "target/${{ matrix.target }}/release/octacity-source-git${{ matrix.extension }}" package-metadata > "$SOURCE_METADATA"
          VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$SOURCE_METADATA")
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "v${VERSION}" ]]; then
            echo "release tag '${{ github.ref_name }}' does not match binary version '${VERSION}'" >&2
            exit 1
          fi
          test "$("target/${{ matrix.target }}/release/octacity-agent${{ matrix.extension }}" --version)" = "octacity-agent ${VERSION}"
          test "$("target/${{ matrix.target }}/release/octacity-server${{ matrix.extension }}" --version)" = "octacity-server ${VERSION}"
          python3 tools/package_release.py \
            --platform "${{ matrix.platform }}" \
            --version "$VERSION" \
            --agent "target/${{ matrix.target }}/release/octacity-agent${{ matrix.extension }}" \
            --source-git "target/${{ matrix.target }}/release/octacity-source-git${{ matrix.extension }}" \
            --source-metadata "$SOURCE_METADATA" \
            --octacity-revision "${{ github.sha }}" \
            --octa-revision "$OCTA_SOURCE_REVISION" \
            --output "dist/octacity-agent-${{ matrix.platform }}.${{ matrix.archive }}"
          python3 tools/package_server_release.py \
            --platform "${{ matrix.platform }}" \
            --version "$VERSION" \
            --server "target/${{ matrix.target }}/release/octacity-server${{ matrix.extension }}" \
            --octacity-revision "${{ github.sha }}" \
            --output "dist/octacity-server-${{ matrix.platform }}.${{ matrix.archive }}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octacity-release-${{ matrix.platform }}
          path: octacity/dist/*
          if-no-files-found: error

  console-package:
    needs:
      - portable-release-gate
      - security-release-gate
      - backend-release-gate
    name: package operator console
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
          persist-credentials: false
      - name: Download the tested console release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: octacity-console-ci-${{ github.run_id }}
          path: octacity/dist-ci
      - name: Verify and promote the tested console release
        working-directory: octacity
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])')
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "v${version}" ]]; then
            echo "release tag '${{ github.ref_name }}' does not match console version '${version}'" >&2
            exit 1
          fi
          candidate="dist-ci/octacity-console-${version}.tar.gz"
          test -f "${candidate}"
          test -f "${candidate}.sha256"
          python3 tools/package_console_release.py verify \
            --archive "${candidate}" \
            --expected-version "${version}" \
            --expected-octacity-revision "${{ github.sha }}"
          mkdir -p dist
          cp "${candidate}" "${candidate}.sha256" dist/
      - name: Upload console release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octacity-release-console
          path: octacity/dist/*
          if-no-files-found: error

  attest-and-publish:
    needs:
      - package
      - console-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: octacity-release-*
          path: dist
          merge-multiple: true
      - name: Attest archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install protobuf compiler
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: protoc
          fallback: none
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
        working-directory: octacity
      - name: Test release packager
        run: python3 -m unittest discover -s tools/tests -v
        working-directory: octacity
      - name: Validate systemd service definition
        if: runner.os == 'Linux'
        run: systemd-analyze verify packaging/systemd/octacity-agent.service
        working-directory: octacity
      - name: Validate launchd service definition
        if: runner.os == 'macOS'
        run: plutil -lint packaging/launchd/com.octahive.octacity-agent.plist
        working-directory: octacity
      - name: Validate Windows service scripts
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: octacity
        run: |
          $failed = $false
          foreach ($path in @("packaging/windows/install-service.ps1", "packaging/windows/uninstall-service.ps1")) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Write-Error
              $failed = $true
            }
          }
          if ($failed) { throw "invalid Windows service script" }
      - name: Check warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: octacity
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D missing_docs
        run: cargo doc --workspace --all-features --no-deps
        working-directory: octacity
      - name: Run portable tests
        run: cargo test --workspace --all-features
        working-directory: octacity

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - name: Install coverage and protobuf tools
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-llvm-cov@0.9.1,protoc
          fallback: none
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Measure workspace coverage
        run: cargo llvm-cov --workspace --all-features --no-report
        working-directory: octacity
      - name: Start pinned MinIO service
        run: |
          docker run --detach --rm --name octacity-coverage-minio \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=octacity \
            -e MINIO_ROOT_PASSWORD=octacity-secret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-coverage-minio
          exit 1
      - name: Cover the S3-compatible storage adapter
        env:
          OCTACITY_MINIO_ENDPOINT: http://127.0.0.1:19000
          OCTACITY_MINIO_ACCESS_KEY: octacity
          OCTACITY_MINIO_SECRET_KEY: octacity-secret
        run: >-
          cargo llvm-cov --no-clean --all-features
          -p octacity-artifact-store --test minio --
          s3_store_satisfies_the_minio_contract --ignored --exact
        working-directory: octacity
      - name: Stop coverage service
        if: always()
        run: docker rm --force octacity-coverage-minio || true
      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info
        working-directory: octacity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lcov
          path: octacity/lcov.info
          if-no-files-found: ignore
      - name: Enforce production line coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines 80
        working-directory: octacity

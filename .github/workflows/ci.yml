name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: octacity
      - uses: actions/checkout@v4
        with:
          repository: OctaHive/octa
          path: octa
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install protobuf compiler
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
          fallback: none
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
        working-directory: octacity
      - name: Check warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: octacity
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D missing_docs
        run: cargo doc --workspace --all-features --no-deps
        working-directory: octacity
      - name: Run portable tests
        run: cargo test --workspace --all-features
        working-directory: octacity

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: octacity
      - uses: actions/checkout@v4
        with:
          repository: OctaHive/octa
          path: octa
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install coverage and protobuf tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,protoc
          fallback: none
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Measure workspace coverage
        run: cargo llvm-cov --workspace --all-features --no-report
        working-directory: octacity
      - name: Start pinned MinIO service
        run: |
          docker run --detach --rm --name octacity-coverage-minio \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=octacity \
            -e MINIO_ROOT_PASSWORD=octacity-secret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-coverage-minio
          exit 1
      - name: Cover the S3-compatible storage adapter
        env:
          OCTACITY_MINIO_ENDPOINT: http://127.0.0.1:19000
          OCTACITY_MINIO_ACCESS_KEY: octacity
          OCTACITY_MINIO_SECRET_KEY: octacity-secret
        run: >-
          cargo llvm-cov --no-clean --all-features
          -p octacity-artifact-store --test minio --
          s3_store_satisfies_the_minio_contract --ignored --exact
        working-directory: octacity
      - name: Stop coverage service
        if: always()
        run: docker rm --force octacity-coverage-minio || true
      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info
        working-directory: octacity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: octacity/lcov.info
          if-no-files-found: ignore
      - name: Enforce production line coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines 80
        working-directory: octacity

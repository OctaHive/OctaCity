name: ci

on:
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  local-stand-containers:
    name: local stand containers and portable contracts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
          persist-credentials: false
      - name: Validate local-stand policies, Compose, and portable contracts
        shell: bash
        working-directory: octacity
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          state_root="${RUNNER_TEMP}/octacity-local-stand-portable"
          log="${RUNNER_TEMP}/octacity-local-stand-portable.log"
          python3 tools/verify_local_stand_inputs.py \
            deployment/local-stand/inputs.json \
            --agent-revision "${revision}"
          python3 tools/verify_local_stand_context.py
          python3 tools/init_local_stand.py --root "${state_root}" >"${log}" 2>&1
          OCTACITY_LOCAL_STAND_ROOT="${state_root}" \
            docker compose --project-name octacity-local-ci --file compose.yaml \
            config --format json >"${RUNNER_TEMP}/octacity-local-stand-compose.json"
          python3 -m unittest -v \
            tools.tests.test_bootstrap_local_stand \
            tools.tests.test_build_local_stand_gateway \
            tools.tests.test_build_local_stand_images \
            tools.tests.test_check_local_stand_logs \
            tools.tests.test_local_stand_compose.LocalStandComposeContractTests \
            tools.tests.test_local_stand_launcher \
            tools.tests.test_start_local_stand_agent >>"${log}" 2>&1
          python3 tools/check_local_stand_logs.py \
            --state-root "${state_root}" --log "${log}"
          cat "${log}"
      - name: Build and verify every Linux ARM64 local-stand image
        shell: bash
        working-directory: octacity
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/octacity-local-stand-images.log"
          python3 tools/build_local_stand_images.py >"${log}" 2>&1
          python3 tools/check_local_stand_logs.py \
            --state-root "${RUNNER_TEMP}/octacity-local-stand-portable" \
            --log "${log}"
          cat "${log}"

  local-stand-native-staging:
    name: local stand native staging and configurations
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - name: Install protobuf compiler
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Stage every native input and validate generated configurations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: octacity
        run: |
          set -euo pipefail
          state_root="${RUNNER_TEMP}/octacity-local-stand-native-state"
          log="${RUNNER_TEMP}/octacity-local-stand-native.log"
          report_native_staging_failure() {
            status=$?
            trap - EXIT
            if [[ "${status}" -eq 0 ]]; then
              return
            fi
            if python3 tools/check_local_stand_logs.py \
              --state-root "${state_root}" --log "${log}"; then
              cat "${log}"
            else
              echo "native staging failed; refusing to emit an unsafe diagnostic log" >&2
            fi
            exit "${status}"
          }
          trap report_native_staging_failure EXIT
          python3 tools/init_local_stand.py --root "${state_root}" >"${log}" 2>&1
          installation=$(python3 tools/stage_local_stand_native.py all \
            --cache-root "${RUNNER_TEMP}/octacity-local-stand-native-cache" \
            --install-root "${RUNNER_TEMP}/octacity-local-stand-native-installations" \
            2>>"${log}")
          case "${installation}" in
            "${RUNNER_TEMP}/octacity-local-stand-native-installations/"*) ;;
            *) echo "native staging returned an unsafe installation path" >&2; exit 1 ;;
          esac
          python3 tools/configure_local_stand_server.py \
            --root "${state_root}" --native-installation "${installation}" \
            >>"${log}" 2>&1
          install -d -m 0700 "${state_root}/agent"
          install -m 0600 /dev/null "${state_root}/agent/credential"
          printf '%s\n' 'configuration-validation-only' \
            >"${state_root}/agent/credential"
          python3 tools/configure_local_stand_agent.py \
            --root "${state_root}" --native-installation "${installation}" \
            >>"${log}" 2>&1
          python3 tools/check_local_stand_logs.py \
            --state-root "${state_root}" --log "${log}"
          cat "${log}"
          trap - EXIT

  local-stand-apple-silicon:
    name: local stand Apple Silicon vertical slice
    # Hosted ARM64 macOS runners cannot expose nested Virtualization.framework.
    # Enable this only when the qualified persistent host runner is online.
    if: github.event_name != 'pull_request' && vars.OCTACITY_APPLE_SILICON_LOCAL_STAND == 'true'
    concurrency:
      group: octacity-local-stand-apple-silicon
      cancel-in-progress: false
    runs-on:
      group: octacity-release
      labels: [self-hosted, macOS, ARM64, octacity-microsandbox]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
          persist-credentials: false
      - name: Require a clean dedicated stand namespace
        shell: bash
        working-directory: octacity
        run: |
          set -euo pipefail
          state_root="${RUNNER_TEMP}/octacity-local-stand-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence="${RUNNER_TEMP}/octacity-local-stand-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${state_root}"
          test ! -e "${evidence}"
          test -z "$(docker ps --all --quiet --filter label=com.docker.compose.project=octacity-local)"
          test -z "$(docker volume ls --quiet --filter name='^octacity-local_')"
          mkdir -m 0700 "${evidence}"
          install -m 0600 /dev/null "${evidence}/lifecycle.log"
          install -m 0600 /dev/null "${evidence}/runtime-running.log"
      - name: Start and exercise the complete hybrid stand
        shell: bash
        working-directory: octacity
        env:
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          state_root="${RUNNER_TEMP}/octacity-local-stand-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence="${RUNNER_TEMP}/octacity-local-stand-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          receipt="${evidence}/vertical-slice.json"
          tools/local-stand up --root "${state_root}" >>"${evidence}/lifecycle.log" 2>&1
          tools/local-stand status --root "${state_root}" >>"${evidence}/lifecycle.log"
          python3 tools/verify_local_stand_integration.py --root "${state_root}" run \
            --source-repository "${SOURCE_REPOSITORY}" \
            --source-revision "${SOURCE_REVISION}" \
            --receipt "${receipt}" >>"${evidence}/lifecycle.log" 2>&1

          tools/local-stand up --root "${state_root}" >>"${evidence}/lifecycle.log" 2>&1
          python3 tools/verify_local_stand_integration.py --root "${state_root}" \
            observe --receipt "${receipt}" >>"${evidence}/lifecycle.log" 2>&1

          tools/local-stand down --root "${state_root}" >>"${evidence}/lifecycle.log" 2>&1
          tools/local-stand up --root "${state_root}" >>"${evidence}/lifecycle.log" 2>&1
          python3 tools/verify_local_stand_integration.py --root "${state_root}" \
            observe --receipt "${receipt}" >>"${evidence}/lifecycle.log" 2>&1
          tools/local-stand logs --root "${state_root}" --tail 1000 \
            >"${evidence}/runtime-running.log" 2>&1
          tools/local-stand down --root "${state_root}" >>"${evidence}/lifecycle.log" 2>&1

          tools/local-stand status --root "${state_root}" >"${evidence}/stopped.json"
          python3 -c 'import json,sys; status=json.load(open(sys.argv[1], encoding="utf-8")); assert status["state"] == "stopped" and status["agent"] == "stopped" and not status["compose"]["present"]' "${evidence}/stopped.json"
      - name: Collect and scan bounded stand diagnostics
        if: always()
        shell: bash
        working-directory: octacity
        run: |
          state_root="${RUNNER_TEMP}/octacity-local-stand-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence="${RUNNER_TEMP}/octacity-local-stand-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -m 0700 "${evidence}"
          tools/local-stand logs --root "${state_root}" --tail 1000 \
            >"${evidence}/runtime.log" 2>&1 || true
          python3 tools/check_local_stand_logs.py \
            --state-root "${state_root}" \
            --log "${evidence}/lifecycle.log" \
            --log "${evidence}/runtime-running.log" \
            --log "${evidence}/runtime.log"
      - name: Remove the dedicated stand state
        if: always()
        shell: bash
        working-directory: octacity
        run: |
          state_root="${RUNNER_TEMP}/octacity-local-stand-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "${state_root}" ]]; then
            tools/local-stand reset --root "${state_root}" \
              --confirm DELETE-OCTACITY-LOCAL-STAND
          fi
      - name: Retain local stand integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-stand-apple-silicon-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/octacity-local-stand-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  console:
    name: operator console
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
          persist-credentials: false
      - name: Checkout pinned Octa revision
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Install protobuf compiler
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: octacity/ui/.node-version
          check-latest: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: octacity/ui/package.json
          run_install: false
      - name: Install locked console dependencies
        working-directory: octacity/ui
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate the management API boundary
        working-directory: octacity/ui
        run: pnpm api:generate
      - name: Check console formatting
        working-directory: octacity/ui
        run: pnpm format
      - name: Check console lint rules
        working-directory: octacity/ui
        run: pnpm lint
      - name: Run console unit and component tests
        working-directory: octacity/ui
        run: pnpm test:unit
      - name: Install the pinned browser runtime
        working-directory: octacity/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the released proxy runtime
        run: sudo apt-get update && sudo apt-get install --yes nginx
      - name: Run console browser, accessibility, and visual tests
        working-directory: octacity/ui
        env:
          CI: "true"
        run: pnpm test:browser
      - name: Build the console and enforce architecture and bundle budgets
        working-directory: octacity/ui
        run: pnpm build
      - id: console-release
        name: Package and verify the console release candidate
        working-directory: octacity
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])')
          mkdir -p dist-ci
          archive="dist-ci/octacity-console-${version}.tar.gz"
          python3 tools/package_console_release.py package \
            --distribution ui/dist \
            --version "${version}" \
            --octacity-revision "${{ github.sha }}" \
            --output "${archive}"
          python3 tools/package_console_release.py verify \
            --archive "${archive}" \
            --expected-version "${version}" \
            --expected-octacity-revision "${{ github.sha }}"
          printf 'archive=%s/%s\n' "${PWD}" "${archive}" >> "${GITHUB_OUTPUT}"
      - id: server-release
        name: Build and package the released server counterpart
        working-directory: octacity
        shell: bash
        env:
          OCTACITY_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])')
          archive="${RUNNER_TEMP}/octacity-server-linux-amd64.tar.gz"
          cargo build --locked --release -p octacity-server
          test "$(target/release/octacity-server --version)" = "octacity-server ${version}"
          python3 tools/package_server_release.py \
            --platform linux-amd64 \
            --version "${version}" \
            --server target/release/octacity-server \
            --octacity-revision "${{ github.sha }}" \
            --output "${archive}"
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"
      - id: released-console
        name: Run the released server and console browser slice
        uses: ./octacity/.github/actions/release-console-browser-slice
        with:
          console-archive: ${{ steps.console-release.outputs.archive }}
          server-archive: ${{ steps.server-release.outputs.archive }}
      - name: Retain released browser evidence
        if: always() && steps.released-console.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octacity-console-browser-${{ github.run_id }}
          path: ${{ steps.released-console.outputs.evidence }}
          if-no-files-found: error
      - name: Retain the verified console release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octacity-console-ci-${{ github.run_id }}
          path: octacity/dist-ci/*
          if-no-files-found: error
          overwrite: true

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - name: Install protobuf compiler
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
        working-directory: octacity
      - name: Check workspace architecture
        run: python3 tools/check_architecture.py
        working-directory: octacity
      - name: Test repository tools
        run: python3 -m unittest discover -s tools/tests -v
        working-directory: octacity
      - name: Validate systemd service definition
        if: runner.os == 'Linux'
        run: |
          # systemd verifies that absolute ExecStart paths exist. The release is
          # not installed on the CI host, so provide an executable only for the
          # duration of this pre-install syntax and sandbox validation.
          test ! -e /opt/octacity/current/bin/octacity-agent
          sudo install -D -m 0755 /bin/true /opt/octacity/current/bin/octacity-agent
          trap 'sudo rm -f /opt/octacity/current/bin/octacity-agent' EXIT
          systemd-analyze verify packaging/systemd/octacity-agent.service
        working-directory: octacity
      - name: Validate launchd service definition
        if: runner.os == 'macOS'
        run: plutil -lint packaging/launchd/com.octahive.octacity-agent.plist
        working-directory: octacity
      - name: Validate Windows service scripts
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: octacity
        run: |
          $failed = $false
          foreach ($path in @("packaging/windows/install-service.ps1", "packaging/windows/uninstall-service.ps1")) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Write-Error
              $failed = $true
            }
          }
          if ($failed) { throw "invalid Windows service script" }
      - name: Check warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: octacity
      - name: Validate generated local-stand configurations with real binaries
        if: runner.os == 'macOS'
        env:
          OCTACITY_AGENT_BIN: ${{ github.workspace }}/octacity/target/debug/octacity-agent
          OCTACITY_SERVER_BIN: ${{ github.workspace }}/octacity/target/debug/octacity-server
        run: |
          cargo build --locked -p octacity-agent -p octacity-server
          python3 -m unittest \
            tools.tests.test_configure_local_stand_agent \
            tools.tests.test_configure_local_stand_server -v
        working-directory: octacity
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D missing_docs
        run: cargo doc --workspace --all-features --no-deps
        working-directory: octacity
      - name: Run portable tests
        run: cargo test --workspace --all-features
        working-directory: octacity

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - name: Install coverage and protobuf tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov@0.9.1,protoc
          fallback: none
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Measure workspace coverage
        run: cargo llvm-cov --workspace --all-features --no-report
        working-directory: octacity
      - name: Start pinned MinIO service
        run: |
          python3 tools/build_pinned_minio.py minio octacity/minio-contract:${GITHUB_SHA} --architecture amd64
          docker run --detach --rm --name octacity-coverage-minio \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=octacity \
            -e MINIO_ROOT_PASSWORD=octacity-secret \
            octacity/minio-contract:${GITHUB_SHA}
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-coverage-minio
          exit 1
        working-directory: octacity
      - name: Start pinned PostgreSQL service
        run: |
          docker run --detach --rm --name octacity-coverage-postgres \
            -p 127.0.0.1:15432:5432 \
            -e POSTGRES_USER=octacity \
            -e POSTGRES_PASSWORD=octacity-secret \
            -e POSTGRES_DB=postgres \
            postgres:18.6-bookworm@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
          for attempt in {1..30}; do
            if docker exec octacity-coverage-postgres pg_isready -U octacity -d postgres >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-coverage-postgres
          exit 1
      - name: Cover the MinIO Artifact Store contract
        env:
          OCTACITY_MINIO_ENDPOINT: http://127.0.0.1:19000
          OCTACITY_MINIO_ACCESS_KEY: octacity
          OCTACITY_MINIO_SECRET_KEY: octacity-secret
        run: >-
          cargo llvm-cov --no-clean --all-features
          -p octacity-artifact-s3 --test minio --
          s3_store_satisfies_the_minio_contract --ignored --exact
        working-directory: octacity
      - name: Cover all PostgreSQL integration contracts
        env:
          OCTACITY_POSTGRES_URL: postgres://octacity:octacity-secret@127.0.0.1:15432/postgres
        run: >-
          cargo llvm-cov --no-clean --all-features
          -p octacity-server-store-postgres --tests --
          --ignored
        working-directory: octacity
      - name: Stop coverage services
        if: always()
        run: |
          docker rm --force octacity-coverage-minio || true
          docker rm --force octacity-coverage-postgres || true
      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info
        working-directory: octacity
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lcov
          path: octacity/lcov.info
          if-no-files-found: ignore
      - name: Enforce production line coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines 80
        working-directory: octacity

name: ci

on:
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - name: Install protobuf compiler
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
        working-directory: octacity
      - name: Check workspace architecture
        run: python3 tools/check_architecture.py
        working-directory: octacity
      - name: Test repository tools
        run: python3 -m unittest discover -s tools/tests -v
        working-directory: octacity
      - name: Validate systemd service definition
        if: runner.os == 'Linux'
        run: |
          # systemd verifies that absolute ExecStart paths exist. The release is
          # not installed on the CI host, so provide an executable only for the
          # duration of this pre-install syntax and sandbox validation.
          test ! -e /opt/octacity/current/bin/octacity-agent
          sudo install -D -m 0755 /bin/true /opt/octacity/current/bin/octacity-agent
          trap 'sudo rm -f /opt/octacity/current/bin/octacity-agent' EXIT
          systemd-analyze verify packaging/systemd/octacity-agent.service
        working-directory: octacity
      - name: Validate launchd service definition
        if: runner.os == 'macOS'
        run: plutil -lint packaging/launchd/com.octahive.octacity-agent.plist
        working-directory: octacity
      - name: Validate Windows service scripts
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: octacity
        run: |
          $failed = $false
          foreach ($path in @("packaging/windows/install-service.ps1", "packaging/windows/uninstall-service.ps1")) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Write-Error
              $failed = $true
            }
          }
          if ($failed) { throw "invalid Windows service script" }
      - name: Check warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: octacity
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D missing_docs
        run: cargo doc --workspace --all-features --no-deps
        working-directory: octacity
      - name: Run portable tests
        run: cargo test --workspace --all-features
        working-directory: octacity

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - name: Install coverage and protobuf tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov@0.9.1,protoc
          fallback: none
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Measure workspace coverage
        run: cargo llvm-cov --workspace --all-features --no-report
        working-directory: octacity
      - name: Start pinned MinIO service
        run: |
          python3 tools/build_pinned_minio.py minio octacity/minio-contract:${GITHUB_SHA} --architecture amd64
          docker run --detach --rm --name octacity-coverage-minio \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=octacity \
            -e MINIO_ROOT_PASSWORD=octacity-secret \
            octacity/minio-contract:${GITHUB_SHA}
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-coverage-minio
          exit 1
        working-directory: octacity
      - name: Start pinned PostgreSQL service
        run: |
          docker run --detach --rm --name octacity-coverage-postgres \
            -p 127.0.0.1:15432:5432 \
            -e POSTGRES_USER=octacity \
            -e POSTGRES_PASSWORD=octacity-secret \
            -e POSTGRES_DB=postgres \
            postgres:18.6-bookworm@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
          for attempt in {1..30}; do
            if docker exec octacity-coverage-postgres pg_isready -U octacity -d postgres >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-coverage-postgres
          exit 1
      - name: Cover the MinIO Artifact Store contract
        env:
          OCTACITY_MINIO_ENDPOINT: http://127.0.0.1:19000
          OCTACITY_MINIO_ACCESS_KEY: octacity
          OCTACITY_MINIO_SECRET_KEY: octacity-secret
        run: >-
          cargo llvm-cov --no-clean --all-features
          -p octacity-artifact-s3 --test minio --
          s3_store_satisfies_the_minio_contract --ignored --exact
        working-directory: octacity
      - name: Cover all PostgreSQL integration contracts
        env:
          OCTACITY_POSTGRES_URL: postgres://octacity:octacity-secret@127.0.0.1:15432/postgres
        run: >-
          cargo llvm-cov --no-clean --all-features
          -p octacity-server-store-postgres --tests --
          --ignored
        working-directory: octacity
      - name: Stop coverage services
        if: always()
        run: |
          docker rm --force octacity-coverage-minio || true
          docker rm --force octacity-coverage-postgres || true
      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info
        working-directory: octacity
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lcov
          path: octacity/lcov.info
          if-no-files-found: ignore
      - name: Enforce production line coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines 80
        working-directory: octacity

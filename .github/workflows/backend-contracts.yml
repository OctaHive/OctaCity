name: backend contracts

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_call:
    inputs:
      cadence:
        description: Invocation class selected by the calling release workflow
        required: true
        type: string
    secrets:
      OCTACITY_RUNNER_INVENTORY_TOKEN:
        description: Fine-grained token with organization Self-hosted runners read access
        required: false
  workflow_dispatch:
    inputs:
      suite:
        description: Cadence or exact backend suite to execute
        required: true
        default: linux-native
        type: choice
        options:
          - all
          - hosted
          - release-qualified
          - failure
          - security
          - lifecycle
          - performance
          - host
          - vault-artifact
          - linux-native
          - linux-containerd
          - linux-microsandbox
          - macos-apple-vf
          - macos-microsandbox
          - windows-microsandbox-preview

permissions:
  contents: read

jobs:
  matrix-plan:
    runs-on: ubuntu-24.04
    outputs:
      requires_self_hosted: ${{ steps.plan.outputs.requires_self_hosted }}
      run_performance_gate: ${{ steps.plan.outputs.run_performance_gate }}
      run_released_host: ${{ steps.plan.outputs.run_released_host }}
      run_failure_matrix: ${{ steps.plan.outputs.run_failure_matrix }}
      run_security_matrix: ${{ steps.plan.outputs.run_security_matrix }}
      run_lifecycle_matrix: ${{ steps.plan.outputs.run_lifecycle_matrix }}
      run_vault_artifact_contract: ${{ steps.plan.outputs.run_vault_artifact_contract }}
      run_linux_native: ${{ steps.plan.outputs.run_linux_native }}
      run_linux_containerd: ${{ steps.plan.outputs.run_linux_containerd }}
      run_linux_microsandbox: ${{ steps.plan.outputs.run_linux_microsandbox }}
      run_macos_apple_vf: ${{ steps.plan.outputs.run_macos_apple_vf }}
      run_macos_microsandbox: ${{ steps.plan.outputs.run_macos_microsandbox }}
      run_windows_microsandbox_preview: ${{ steps.plan.outputs.run_windows_microsandbox_preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Plan backend jobs for this invocation
        id: plan
        run: >-
          python3 octacity/tools/backend_matrix.py plan
          --event-name "${{ github.event_name }}"
          --suite "${{ inputs.suite }}"
          --cadence "${{ inputs.cadence }}"
          --github-output "${GITHUB_OUTPUT}"

  runner-inventory:
    needs: matrix-plan
    if: ${{ needs.matrix-plan.outputs.requires_self_hosted == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      inventory_available: ${{ steps.runners.outputs.inventory_available }}
      runner_group_available: ${{ steps.runners.outputs.runner_group_available }}
      runner_macos_apple_vf: ${{ steps.runners.outputs.runner_macos_apple_vf }}
      runner_macos_microsandbox: ${{ steps.runners.outputs.runner_macos_microsandbox }}
      runner_windows_microsandbox_preview: ${{ steps.runners.outputs.runner_windows_microsandbox_preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Inspect explicitly provisioned self-hosted runners
        id: runners
        env:
          OCTACITY_RUNNER_INVENTORY_TOKEN: ${{ secrets.OCTACITY_RUNNER_INVENTORY_TOKEN }}
        run: >-
          python3 octacity/tools/backend_matrix.py inventory
          --api-url "${GITHUB_API_URL}"
          --organization "${GITHUB_REPOSITORY_OWNER}"
          --repository "${{ github.event.repository.name }}"
          --repository-private "${{ github.event.repository.private }}"
          --github-output "${GITHUB_OUTPUT}"

  released-host:
    needs: matrix-plan
    if: ${{ needs.matrix-plan.outputs.run_released_host == 'true' }}
    name: released host
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-14
          - platform: windows-amd64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Set up Microsandbox guest agent for the Agent build
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux Agent build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Stage the pinned released Octa toolchain
        uses: ./octacity/.github/actions/stage-octa-release
        with:
          version: ${{ steps.octa-source.outputs.version }}
          revision: ${{ steps.octa-source.outputs.revision }}
      - name: Package the released Agent candidate
        id: release-candidate
        uses: ./octacity/.github/actions/package-release-candidate
        with:
          octa-revision: ${{ steps.octa-source.outputs.revision }}
          include-server: "false"
          source-allow-file: "true"
      - name: Prepare private Host contract roots
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/octacity-host-contract"
          mkdir -p "${root}/work" "${root}/evidence"
          printf 'OCTACITY_CONTRACT_HOST_WORK_ROOT=%s\n' "${root}/work" >> "${GITHUB_ENV}"
          printf 'OCTACITY_CONTRACT_HOST_ENVIRONMENT_ID=host-release-v1\n' >> "${GITHUB_ENV}"
          printf 'OCTACITY_CONTRACT_WORKSPACE_BYTES=33554432\n' >> "${GITHUB_ENV}"
          printf 'OCTACITY_RELEASE_HOST_EVIDENCE_DIR=%s\n' "${root}/evidence" >> "${GITHUB_ENV}"
      - name: Run the real direct Host backend contract
        run: >-
          cargo test -p octacity-job --test backend_contract
          host_backend_satisfies_the_real_runner_contract -- --ignored --exact --nocapture
        working-directory: octacity
      - name: Run the released Host Agent contract
        env:
          OCTACITY_RELEASE_AGENT_ROOT: ${{ steps.release-candidate.outputs.agent-root }}
          OCTACITY_CONTRACT_HOST_SOURCE_ROOT: ${{ github.workspace }}/octa
        run: >-
          cargo test -p octacity-release-harness --test released_host_agent
          released_host_agent_satisfies_the_portable_execution_contract -- --ignored --exact --nocapture
        working-directory: octacity
      - name: Retain released Host evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-host-${{ matrix.platform }}
          path: ${{ runner.temp }}/octacity-host-contract/evidence
          if-no-files-found: error

  failure-matrix:
    needs: matrix-plan
    if: ${{ needs.matrix-plan.outputs.run_failure_matrix == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Set up Microsandbox guest agent for compilation
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - name: Install protobuf compiler
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Start disposable failure-injection dependencies
        run: |
          python3 tools/build_pinned_minio.py minio octacity/minio-contract:${GITHUB_SHA} --architecture amd64
          docker run --detach --rm --name octacity-failure-minio \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=octacity \
            -e MINIO_ROOT_PASSWORD=octacity-secret \
            octacity/minio-contract:${GITHUB_SHA}
          docker run --detach --rm --name octacity-failure-postgres \
            -p 127.0.0.1:15432:5432 \
            -e POSTGRES_USER=octacity \
            -e POSTGRES_PASSWORD=octacity-secret \
            -e POSTGRES_DB=postgres \
            postgres:18.6-bookworm@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null \
              && docker exec octacity-failure-postgres pg_isready -U octacity -d postgres >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-failure-minio
          docker logs octacity-failure-postgres
          exit 1
        working-directory: octacity
      - name: Run the complete failure-injection matrix
        working-directory: octacity
        env:
          OCTACITY_MINIO_ENDPOINT: http://127.0.0.1:19000
          OCTACITY_MINIO_ACCESS_KEY: octacity
          OCTACITY_MINIO_SECRET_KEY: octacity-secret
          OCTACITY_POSTGRES_URL: postgres://octacity:octacity-secret@127.0.0.1:15432/postgres
        run: >-
          python3 tools/failure_matrix.py run
          --evidence-dir "${RUNNER_TEMP}/octacity-failure-matrix"
      - name: Stop disposable failure-injection dependencies
        if: always()
        run: >-
          docker rm --force
          octacity-failure-minio octacity-failure-postgres || true
      - name: Retain failure-injection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-failure-matrix
          path: ${{ runner.temp }}/octacity-failure-matrix
          if-no-files-found: error

  security-matrix:
    needs: matrix-plan
    if: ${{ needs.matrix-plan.outputs.run_security_matrix == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Set up Microsandbox guest agent for compilation
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - name: Install protobuf compiler
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Start disposable security-state dependency
        run: |
          docker run --detach --rm --name octacity-security-postgres \
            -p 127.0.0.1:15432:5432 \
            -e POSTGRES_USER=octacity \
            -e POSTGRES_PASSWORD=octacity-secret \
            -e POSTGRES_DB=postgres \
            postgres:18.6-bookworm@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
          for attempt in {1..30}; do
            if docker exec octacity-security-postgres \
              pg_isready -U octacity -d postgres >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-security-postgres
          exit 1
      - name: Run the complete security-boundary matrix
        working-directory: octacity
        env:
          OCTACITY_POSTGRES_URL: postgres://octacity:octacity-secret@127.0.0.1:15432/postgres
        run: >-
          python3 tools/security_matrix.py run
          --evidence-dir "${RUNNER_TEMP}/octacity-security-matrix"
      - name: Stop disposable security-state dependency
        if: always()
        run: docker rm --force octacity-security-postgres || true
      - name: Retain security-boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-security-matrix
          path: ${{ runner.temp }}/octacity-security-matrix
          if-no-files-found: error

  lifecycle-matrix:
    needs: matrix-plan
    if: ${{ needs.matrix-plan.outputs.run_lifecycle_matrix == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Set up Microsandbox guest agent for compilation
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - name: Install protobuf compiler
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Run the complete service and provider lifecycle matrix
        working-directory: octacity
        run: >-
          python3 tools/lifecycle_matrix.py run
          --evidence-dir "${RUNNER_TEMP}/octacity-lifecycle-matrix"
      - name: Retain release lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lifecycle-matrix
          path: ${{ runner.temp }}/octacity-lifecycle-matrix
          if-no-files-found: error

  vault-artifact-contract:
    needs: matrix-plan
    if: ${{ needs.matrix-plan.outputs.run_vault_artifact_contract == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Build the real Octa runner and required plugins
        run: cargo build -p octa-runner -p octa_plugin_shell -p octa_plugin_tpl
        working-directory: octa
      - name: Start pinned Vault and MinIO services
        run: |
          python3 tools/build_pinned_minio.py minio octacity/minio-contract:${GITHUB_SHA} --architecture amd64
          docker run --detach --rm --name octacity-vault-contract --cap-add=IPC_LOCK \
            -p 127.0.0.1:18200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=octacity-root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:2.1.1@sha256:8af37ae9d45e4a0fac48ab700e0d99efc4c2d6cd84354a869f2147f1d3abab46
          docker run --detach --rm --name octacity-minio-contract \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=octacity \
            -e MINIO_ROOT_PASSWORD=octacity-secret \
            octacity/minio-contract:${GITHUB_SHA}
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18200/v1/sys/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-vault-contract
          docker logs octacity-minio-contract
          exit 1
        working-directory: octacity
      - name: Run the Vault and artifact service contract
        env:
          OCTACITY_MINIO_ENDPOINT: http://127.0.0.1:19000
          OCTACITY_MINIO_ACCESS_KEY: octacity
          OCTACITY_MINIO_SECRET_KEY: octacity-secret
          OCTACITY_VAULT_ENDPOINT: http://127.0.0.1:18200
          OCTACITY_VAULT_ROOT_TOKEN: octacity-root
          OCTACITY_SERVICE_CONTRACT_OCTA_RUNNER: ${{ github.workspace }}/octa/target/debug/octa-runner
          OCTACITY_SERVICE_CONTRACT_OCTA_PLUGINS_DIR: ${{ github.workspace }}/octa/target/debug
        run: >-
          cargo test -p octacity-service-contract-tests --test vault_artifact
          real_octa_vault_job_publishes_outputs_without_leaking_secrets
          -- --ignored --exact --nocapture
        working-directory: octacity
      - name: Stop test services
        if: always()
        run: docker rm --force octacity-vault-contract octacity-minio-contract || true

  linux-native:
    needs: matrix-plan
    if: ${{ needs.matrix-plan.outputs.run_linux_native == 'true' }}
    runs-on: ubuntu-24.04
    env:
      OCTACITY_PERFORMANCE_GATE: ${{ needs.matrix-plan.outputs.run_performance_gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux Native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          apparmor apparmor-profiles apparmor-utils bubblewrap e2fsprogs libcap-ng-dev
      - name: Prepare GitHub-hosted Linux Native environment
        working-directory: octacity
        env:
          OCTA_RELEASE_VERSION: ${{ steps.octa-source.outputs.version }}
          OCTA_SOURCE_REVISION: ${{ steps.octa-source.outputs.revision }}
        run: tools/runner/github-hosted-native.sh setup "$OCTA_RELEASE_VERSION" "$OCTA_SOURCE_REVISION"
      - run: >-
          tools/runner/github-hosted-native.sh run
          cargo test -p octacity-job --test backend_contract
          native_backend_satisfies_the_real_runner_contract -- --ignored --exact --nocapture
        working-directory: octacity
      - name: Package the server and Agent release candidates
        id: release-candidate
        uses: ./octacity/.github/actions/package-release-candidate
        with:
          octa-revision: ${{ steps.octa-source.outputs.revision }}
      - name: Run released Linux Native vertical slice
        id: release-slice
        uses: ./octacity/.github/actions/release-agent-vertical-slice
        with:
          server-root: ${{ steps.release-candidate.outputs.server-root }}
          agent-root: ${{ steps.release-candidate.outputs.agent-root }}
          backend: native
          execution-wrapper: ${{ github.workspace }}/octacity/tools/runner/github-hosted-native.sh
          codex-fixture: "true"
      - name: Enforce explicit release performance budgets
        if: ${{ env.OCTACITY_PERFORMANCE_GATE == 'true' && steps.release-slice.outcome == 'success' }}
        working-directory: octacity
        run: >-
          python3 tools/performance_matrix.py evaluate
          --measurements "${{ steps.release-slice.outputs.evidence }}/performance-measurements.json"
          --report "${{ steps.release-slice.outputs.evidence }}/performance-report.json"
      - name: Retain Linux Native release evidence
        if: always() && steps.release-slice.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-slice-linux-native
          path: ${{ steps.release-slice.outputs.evidence }}
          if-no-files-found: error
      - name: Clean up GitHub-hosted Linux Native environment
        if: always()
        working-directory: octacity
        run: tools/runner/github-hosted-native.sh cleanup

  linux-containerd:
    needs: matrix-plan
    if: ${{ needs.matrix-plan.outputs.run_linux_containerd == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux OCI build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Prepare disposable containerd environment
        working-directory: octacity
        env:
          OCTA_RELEASE_VERSION: ${{ steps.octa-source.outputs.version }}
          OCTA_SOURCE_REVISION: ${{ steps.octa-source.outputs.revision }}
        run: tools/runner/github-hosted-oci.sh setup containerd "$OCTA_RELEASE_VERSION" "$OCTA_SOURCE_REVISION"
      - name: Run real containerd backend contract
        run: >-
          cargo test -p octacity-job --test backend_contract
          containerd_isolation_provider_satisfies_the_real_runner_contract -- --ignored --exact --nocapture
        working-directory: octacity
      - name: Package the server and Agent release candidates
        id: release-candidate
        uses: ./octacity/.github/actions/package-release-candidate
        with:
          octa-revision: ${{ steps.octa-source.outputs.revision }}
      - name: Run released Linux containerd vertical slice
        id: release-slice
        uses: ./octacity/.github/actions/release-agent-vertical-slice
        with:
          server-root: ${{ steps.release-candidate.outputs.server-root }}
          agent-root: ${{ steps.release-candidate.outputs.agent-root }}
          backend: containerd
      - name: Verify containerd cleanup
        working-directory: octacity
        run: tools/runner/github-hosted-oci.sh verify-clean containerd
      - name: Retain Linux containerd release evidence
        if: always() && steps.release-slice.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-slice-linux-containerd
          path: ${{ steps.release-slice.outputs.evidence }}
          if-no-files-found: error
      - name: Clean up disposable containerd environment
        if: always()
        working-directory: octacity
        run: tools/runner/github-hosted-oci.sh cleanup containerd

  linux-microsandbox:
    needs: matrix-plan
    if: ${{ needs.matrix-plan.outputs.run_linux_microsandbox == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
          fallback: none
      - name: Install Linux OCI build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcap-ng-dev
      - name: Prepare disposable Linux Microsandbox environment
        working-directory: octacity
        env:
          OCTA_RELEASE_VERSION: ${{ steps.octa-source.outputs.version }}
          OCTA_SOURCE_REVISION: ${{ steps.octa-source.outputs.revision }}
        run: tools/runner/github-hosted-oci.sh setup microsandbox "$OCTA_RELEASE_VERSION" "$OCTA_SOURCE_REVISION"
      - name: Run real Linux Microsandbox backend contract
        run: >-
          cargo test -p octacity-job --test backend_contract
          microsandbox_backend_satisfies_the_real_runner_contract -- --ignored --exact --nocapture
        working-directory: octacity
      - name: Package the server and Agent release candidates
        id: release-candidate
        uses: ./octacity/.github/actions/package-release-candidate
        with:
          octa-revision: ${{ steps.octa-source.outputs.revision }}
      - name: Run released Linux Microsandbox vertical slice
        id: release-slice
        uses: ./octacity/.github/actions/release-agent-vertical-slice
        with:
          server-root: ${{ steps.release-candidate.outputs.server-root }}
          agent-root: ${{ steps.release-candidate.outputs.agent-root }}
          backend: linux-microsandbox
      - name: Verify Microsandbox cleanup
        working-directory: octacity
        run: tools/runner/github-hosted-oci.sh verify-clean microsandbox
      - name: Retain Linux Microsandbox release evidence
        if: always() && steps.release-slice.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-slice-linux-microsandbox
          path: ${{ steps.release-slice.outputs.evidence }}
          if-no-files-found: error
      - name: Clean up disposable Linux Microsandbox environment
        if: always()
        working-directory: octacity
        run: tools/runner/github-hosted-oci.sh cleanup microsandbox


        with:
          tool: protoc
          fallback: none
      - name: Prepare pinned Windows WHP Microsandbox environment
        shell: pwsh
        working-directory: octacity
        env:
          OCTA_RELEASE_VERSION: ${{ steps.octa-source.outputs.version }}
          OCTA_SOURCE_REVISION: ${{ steps.octa-source.outputs.revision }}
        run: tools/runner/self-hosted-microsandbox-whp.ps1 setup $env:OCTA_RELEASE_VERSION $env:OCTA_SOURCE_REVISION
      - name: Run real Windows WHP Microsandbox backend contract

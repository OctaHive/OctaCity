name: backend contracts

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Real backend suite to execute
        required: true
        default: released-agent
        type: choice
        options:
          - released-agent
          - all
          - phase6
          - linux-native
          - linux-containerd
          - macos-microsandbox

permissions:
  contents: read

jobs:
  phase6-vault-minio:
    if: ${{ inputs.suite == 'all' || inputs.suite == 'phase6' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: Build the real Octa runner and required plugins
        run: cargo build -p octa-runner -p octa_plugin_shell -p octa_plugin_tpl
        working-directory: octa
      - name: Start pinned Vault and MinIO services
        run: |
          docker run --detach --rm --name octacity-phase6-vault --cap-add=IPC_LOCK \
            -p 127.0.0.1:18200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=octacity-root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.20.4@sha256:268bb80aa9c6d13d65fcfa05c0c268caca068952240a8087291a6ce0b66e3a10
          docker run --detach --rm --name octacity-phase6-minio \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=octacity \
            -e MINIO_ROOT_PASSWORD=octacity-secret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18200/v1/sys/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs octacity-phase6-vault
          docker logs octacity-phase6-minio
          exit 1
      - name: Run the phase-six Vault and S3 completion gate
        env:
          OCTACITY_MINIO_ENDPOINT: http://127.0.0.1:19000
          OCTACITY_MINIO_ACCESS_KEY: octacity
          OCTACITY_MINIO_SECRET_KEY: octacity-secret
          OCTACITY_VAULT_ENDPOINT: http://127.0.0.1:18200
          OCTACITY_VAULT_ROOT_TOKEN: octacity-root
          OCTACITY_PHASE6_OCTA_RUNNER: ${{ github.workspace }}/octa/target/debug/octa-runner
          OCTACITY_PHASE6_OCTA_PLUGINS_DIR: ${{ github.workspace }}/octa/target/debug
        run: >-
          cargo test -p octacity-phase6-contract-tests --test protocol_minio
          real_octa_vault_job_publishes_outputs_without_leaking_secrets
          -- --ignored --exact --nocapture
        working-directory: octacity
      - name: Stop test services
        if: always()
        run: docker rm --force octacity-phase6-vault octacity-phase6-minio || true

  linux-native:
    if: ${{ inputs.suite == 'all' || inputs.suite == 'released-agent' || inputs.suite == 'linux-native' }}
    runs-on: [self-hosted, linux, octacity-native]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: protoc
          fallback: none
      - run: >-
          cargo test -p octacity-job --test backend_contract
          native_backend_satisfies_the_real_runner_contract -- --ignored --exact --nocapture
        working-directory: octacity
      - name: Package the Agent release candidate
        id: agent-candidate
        uses: ./octacity/.github/actions/package-agent-candidate
        with:
          octa-revision: ${{ steps.octa-source.outputs.revision }}
      - name: Run released Linux Native vertical slice
        id: release-slice
        uses: ./octacity/.github/actions/release-agent-vertical-slice
        with:
          agent-root: ${{ steps.agent-candidate.outputs.root }}
          backend: native
      - name: Retain Linux Native release evidence
        if: always() && steps.release-slice.outputs.evidence != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-slice-linux-native
          path: ${{ steps.release-slice.outputs.evidence }}
          if-no-files-found: error

  linux-containerd:
    if: ${{ inputs.suite == 'all' || inputs.suite == 'linux-containerd' }}
    runs-on: [self-hosted, linux, octacity-containerd]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - run: >-
          cargo test -p octacity-job --test backend_contract
          containerd_process_engine_satisfies_the_real_runner_contract -- --ignored --exact --nocapture
        working-directory: octacity

  macos-microsandbox:
    if: ${{ inputs.suite == 'all' || inputs.suite == 'released-agent' || inputs.suite == 'macos-microsandbox' }}
    runs-on: [self-hosted, macOS, ARM64, octacity-microsandbox]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: octacity
      - name: Checkout pinned Octa revision
        id: octa-source
        uses: ./octacity/.github/actions/checkout-octa
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: Set up Microsandbox guest agent
        uses: ./octacity/.github/actions/setup-microsandbox-agentd
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: protoc
          fallback: none
      - run: >-
          cargo test -p octacity-job --test backend_contract
          microsandbox_backend_satisfies_the_real_runner_contract -- --ignored --exact --nocapture
        working-directory: octacity
      - name: Package the Agent release candidate
        id: agent-candidate
        uses: ./octacity/.github/actions/package-agent-candidate
        with:
          octa-revision: ${{ steps.octa-source.outputs.revision }}
      - name: Run released macOS Microsandbox vertical slice
        id: release-slice
        uses: ./octacity/.github/actions/release-agent-vertical-slice
        with:
          agent-root: ${{ steps.agent-candidate.outputs.root }}
          backend: microsandbox
      - name: Retain macOS Microsandbox release evidence
        if: always() && steps.release-slice.outputs.evidence != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-slice-macos-microsandbox
          path: ${{ steps.release-slice.outputs.evidence }}
          if-no-files-found: error

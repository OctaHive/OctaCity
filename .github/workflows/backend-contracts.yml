  backend-evidence:
    if: ${{ always() }}
    needs:
      - matrix-plan
      - runner-inventory
      - failure-matrix
      - security-matrix
      - lifecycle-matrix
      - released-host
      - vault-artifact-contract
      - linux-native
      - linux-containerd
      - linux-microsandbox
      - macos-microsandbox
      - windows-microsandbox-preview
      - macos-apple-vf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: octacity
      - name: Verify required backend release evidence
        env:
          OCTACITY_BACKEND_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          needs="${RUNNER_TEMP}/octacity-backend-needs.json"
          printf '%s\n' "${OCTACITY_BACKEND_NEEDS}" > "${needs}"
          python3 octacity/tools/backend_matrix.py verify \
            --event-name "${{ github.event_name }}" \
            --suite "${{ inputs.suite }}" \
            --cadence "${{ inputs.cadence }}" \
            --needs "${needs}"

name: Run released-product vertical slice
description: Execute isolated server, Agent, Octa, runner, and plugin bundles against real dependencies

inputs:
  server-root:
    description: Extracted checksummed server release root
    required: true
  agent-root:
    description: Extracted checksummed Agent release root
    required: true
  backend:
    description: Provisioned execution backend (native, containerd, apple-vf-isolation, linux-microsandbox, or microsandbox)
    required: true
  execution-wrapper:
    description: Optional host cgroup entrypoint used to execute the scenario command
    required: false
    default: ""

outputs:
  evidence:
    description: Directory containing release manifests, REST state, events, and Agent logs
    value: ${{ steps.test.outputs.evidence }}

runs:
  using: composite
  steps:
    - name: Prepare isolated released products
      shell: bash
      working-directory: octacity
      env:
        OCTACITY_CANDIDATE_SERVER_ROOT: ${{ inputs.server-root }}
        OCTACITY_CANDIDATE_AGENT_ROOT: ${{ inputs.agent-root }}
      run: |
        set -euo pipefail
        : "${OCTACITY_CONTRACT_OCTA_RELEASE_ROOT:?runner must configure a checksummed Octa release root}"
        stage=$(mktemp -d "${RUNNER_TEMP}/octacity-release-installation.XXXXXX")
        receipt="${stage}/installation.json"
        cargo run --quiet --locked -p octacity-release-harness -- prepare \
          --server-root "${OCTACITY_CANDIDATE_SERVER_ROOT}" \
          --agent-root "${OCTACITY_CANDIDATE_AGENT_ROOT}" \
          --octa-root "${OCTACITY_CONTRACT_OCTA_RELEASE_ROOT}" \
          --install-root "${stage}/root" > "${receipt}"
        python3 - "${receipt}" "${GITHUB_ENV}" <<'PY'
        import json
        import pathlib
        import sys

        receipt = pathlib.Path(sys.argv[1])
        installation = json.loads(receipt.read_text(encoding="utf-8"))
        with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as environment:
            environment.write(f"OCTACITY_RELEASE_SERVER_ROOT={installation['server_root']}\n")
            environment.write(f"OCTACITY_RELEASE_AGENT_ROOT={installation['agent_root']}\n")
            environment.write(f"OCTACITY_CONTRACT_OCTA_RELEASE_ROOT={installation['octa_root']}\n")
            environment.write(f"OCTACITY_RELEASE_INSTALLATION_RECEIPT={receipt}\n")
        PY

    - name: Start disposable PostgreSQL and MinIO
      shell: bash
      working-directory: octacity
      run: |
        set -euo pipefail
        suffix=$(printf '%s-%s-%s' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_JOB}" | tr -c 'A-Za-z0-9_.-' '-')
        postgres_name="octacity-release-postgres-${suffix}"
        minio_name="octacity-release-minio-${suffix}"
        minio_image="octacity/minio-contract:${GITHUB_SHA}"
        printf 'OCTACITY_RELEASE_POSTGRES_CONTAINER=%s\n' "${postgres_name}" >> "${GITHUB_ENV}"
        printf 'OCTACITY_RELEASE_MINIO_CONTAINER=%s\n' "${minio_name}" >> "${GITHUB_ENV}"
        python3 tools/build_pinned_minio.py minio "${minio_image}" --architecture amd64
        docker run --detach --rm --name "${postgres_name}" \
          -p 127.0.0.1::5432 \
          -e POSTGRES_USER=octacity \
          -e POSTGRES_PASSWORD=octacity-secret \
          postgres:18.6-bookworm@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
        docker run --detach --rm --name "${minio_name}" \
          -p 127.0.0.1::9000 \
          -e MINIO_ROOT_USER=octacity \
          -e MINIO_ROOT_PASSWORD=octacity-secret \
          "${minio_image}"

        postgres_port=$(docker port "${postgres_name}" 5432/tcp | awk -F: 'NR == 1 {print $NF}')
        minio_port=$(docker port "${minio_name}" 9000/tcp | awk -F: 'NR == 1 {print $NF}')
        printf 'OCTACITY_POSTGRES_URL=postgres://octacity:octacity-secret@127.0.0.1:%s/postgres\n' "${postgres_port}" >> "${GITHUB_ENV}"
        printf 'OCTACITY_MINIO_ENDPOINT=http://127.0.0.1:%s\n' "${minio_port}" >> "${GITHUB_ENV}"

        services_ready=false
        for attempt in {1..60}; do
          if docker exec "${postgres_name}" pg_isready -U octacity >/dev/null \
            && curl --fail --silent "http://127.0.0.1:${minio_port}/minio/health/live" >/dev/null; then
            services_ready=true
            break
          fi
          sleep 1
        done
        if [[ "${services_ready}" != true ]]; then
          docker logs "${postgres_name}"
          docker logs "${minio_name}"
          exit 1
        fi
        docker exec -e MC_CONFIG_DIR=/tmp/.mc "${minio_name}" \
          mc alias set local http://127.0.0.1:9000 octacity octacity-secret
        docker exec -e MC_CONFIG_DIR=/tmp/.mc "${minio_name}" \
          mc mb --ignore-existing local/octacity-artifacts

    - id: test
      name: Run release vertical slice
      shell: bash
      working-directory: octacity
      env:
        OCTACITY_RELEASE_BACKEND: ${{ inputs.backend }}
        OCTACITY_RELEASE_EXECUTION_WRAPPER: ${{ inputs.execution-wrapper }}
        OCTACITY_RELEASE_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
      run: |
        set -euo pipefail
        evidence=$(mktemp -d "${RUNNER_TEMP}/octacity-release-evidence.XXXXXX")
        printf 'evidence=%s\n' "${evidence}" >> "${GITHUB_OUTPUT}"
        export OCTACITY_RELEASE_EVIDENCE_DIR="${evidence}"
        cp "${OCTACITY_RELEASE_INSTALLATION_RECEIPT}" "${evidence}/installation.json"
        case "${OCTACITY_RELEASE_BACKEND}" in
          native) test_name=released_linux_native_matrix_satisfies_the_end_to_end_contract ;;
          containerd) test_name=released_linux_containerd_matrix_satisfies_the_end_to_end_contract ;;
          apple-vf-isolation) test_name=released_macos_apple_vf_matrix_satisfies_the_end_to_end_contract ;;
          linux-microsandbox) test_name=released_linux_microsandbox_matrix_satisfies_the_end_to_end_contract ;;
          microsandbox) test_name=released_macos_microsandbox_matrix_satisfies_the_end_to_end_contract ;;
          *) printf 'unsupported release backend: %s\n' "${OCTACITY_RELEASE_BACKEND}" >&2; exit 1 ;;
        esac
        command=(cargo test --locked -p octacity-release-harness --test release_vertical_slice "${test_name}"
          -- --ignored --exact --nocapture)
        if [[ -n "${OCTACITY_RELEASE_EXECUTION_WRAPPER}" ]]; then
          "${OCTACITY_RELEASE_EXECUTION_WRAPPER}" run "${command[@]}"
        else
          "${command[@]}"
        fi

    - name: Stop disposable services
      if: always()
      shell: bash
      env:
        OCTACITY_RELEASE_EVIDENCE_DIR: ${{ steps.test.outputs.evidence }}
      run: |
        if [[ -n "${OCTACITY_RELEASE_EVIDENCE_DIR}" ]]; then
          docker logs "${OCTACITY_RELEASE_MINIO_CONTAINER}" \
            > "${OCTACITY_RELEASE_EVIDENCE_DIR}/minio.log" 2>&1 || true
        fi
        docker rm --force \
          "${OCTACITY_RELEASE_MINIO_CONTAINER:-octacity-release-minio-not-started}" \
          "${OCTACITY_RELEASE_POSTGRES_CONTAINER:-octacity-release-postgres-not-started}" || true

name: Run released console browser slice
description: Exercise matching released server and console products through the packaged same-origin proxy

inputs:
  server-archive:
    description: Checksummed Linux AMD64 server release-candidate archive
    required: true
  console-archive:
    description: Checksummed platform-independent console release-candidate archive
    required: true

outputs:
  evidence:
    description: Directory containing released server, proxy, and browser evidence
    value: ${{ steps.test.outputs.evidence }}

runs:
  using: composite
  steps:
    - name: Verify and install matching released products
      shell: bash
      working-directory: octacity
      env:
        OCTACITY_CANDIDATE_CONSOLE_ARCHIVE: ${{ inputs.console-archive }}
        OCTACITY_CANDIDATE_SERVER_ARCHIVE: ${{ inputs.server-archive }}
      run: |
        set -euo pipefail
        stage=$(mktemp -d "${RUNNER_TEMP}/octacity-console-release.XXXXXX")
        server_source="${stage}/server-source"
        console_source="${stage}/console-source"
        installation="${stage}/installation"
        mkdir -p "${server_source}" "${console_source}"
        python3 tools/package_console_release.py verify \
          --archive "${OCTACITY_CANDIDATE_CONSOLE_ARCHIVE}"
        python3 - "${OCTACITY_CANDIDATE_SERVER_ARCHIVE}" <<'PY'
        import hashlib
        import pathlib
        import sys

        archive = pathlib.Path(sys.argv[1])
        checksum, name = archive.with_name(archive.name + ".sha256").read_text(encoding="utf-8").split()
        if name != archive.name or hashlib.sha256(archive.read_bytes()).hexdigest() != checksum:
            raise SystemExit("server release-candidate archive checksum mismatch")
        PY
        python3 -c 'import shutil,sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])' \
          "${OCTACITY_CANDIDATE_SERVER_ARCHIVE}" "${server_source}"
        python3 -c 'import shutil,sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])' \
          "${OCTACITY_CANDIDATE_CONSOLE_ARCHIVE}" "${console_source}"
        receipt="${stage}/installation.json"
        cargo run --quiet --locked -p octacity-release-harness -- prepare-browser \
          --server-root "${server_source}" \
          --console-root "${console_source}" \
          --install-root "${installation}" > "${receipt}"
        python3 - "${receipt}" "${GITHUB_ENV}" <<'PY'
        import json
        import pathlib
        import sys

        receipt = pathlib.Path(sys.argv[1])
        installation = json.loads(receipt.read_text(encoding="utf-8"))
        with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as environment:
            environment.write(f"OCTACITY_RELEASE_SERVER_ROOT={installation['server_root']}\n")
            environment.write(f"OCTACITY_RELEASE_CONSOLE_ROOT={installation['console_root']}\n")
            environment.write(f"OCTACITY_RELEASE_BROWSER_RECEIPT={receipt}\n")
        PY

    - name: Start disposable PostgreSQL
      shell: bash
      working-directory: octacity
      run: |
        set -euo pipefail
        suffix=$(printf '%s-%s-%s' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_JOB}" | tr -c 'A-Za-z0-9_.-' '-')
        postgres_name="octacity-console-postgres-${suffix}"
        printf 'OCTACITY_RELEASE_POSTGRES_CONTAINER=%s\n' "${postgres_name}" >> "${GITHUB_ENV}"
        docker run --detach --rm --name "${postgres_name}" \
          -p 127.0.0.1::5432 \
          -e POSTGRES_USER=octacity \
          -e POSTGRES_PASSWORD=octacity-secret \
          postgres:18.6-bookworm@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
        postgres_port=$(docker port "${postgres_name}" 5432/tcp | awk -F: 'NR == 1 {print $NF}')
        printf 'OCTACITY_POSTGRES_URL=postgres://octacity:octacity-secret@127.0.0.1:%s/postgres\n' \
          "${postgres_port}" >> "${GITHUB_ENV}"
        ready=false
        for attempt in {1..60}; do
          if docker exec "${postgres_name}" pg_isready -U octacity >/dev/null; then
            ready=true
            break
          fi
          sleep 1
        done
        if [[ "${ready}" != true ]]; then
          docker logs "${postgres_name}"
          exit 1
        fi

    - id: test
      name: Exercise the released same-origin browser product
      shell: bash
      working-directory: octacity
      env:
        OCTACITY_MINIO_ENDPOINT: http://127.0.0.1:9
        OCTACITY_RELEASE_NGINX: /usr/sbin/nginx
        OCTACITY_RELEASE_UI_ROOT: ${{ github.workspace }}/octacity/ui
      run: |
        set -euo pipefail
        evidence=$(mktemp -d "${RUNNER_TEMP}/octacity-console-evidence.XXXXXX")
        printf 'evidence=%s\n' "${evidence}" >> "${GITHUB_OUTPUT}"
        export OCTACITY_RELEASE_EVIDENCE_DIR="${evidence}"
        cp "${OCTACITY_RELEASE_BROWSER_RECEIPT}" "${evidence}/installation.json"
        cargo test --locked -p octacity-release-harness --test release_vertical_slice \
          released_console_satisfies_the_same_origin_browser_contract \
          -- --ignored --exact --nocapture

    - name: Stop disposable services
      if: always()
      shell: bash
      env:
        OCTACITY_RELEASE_EVIDENCE_DIR: ${{ steps.test.outputs.evidence }}
      run: |
        if [[ -n "${OCTACITY_RELEASE_EVIDENCE_DIR}" ]]; then
          docker logs "${OCTACITY_RELEASE_POSTGRES_CONTAINER}" \
            > "${OCTACITY_RELEASE_EVIDENCE_DIR}/postgres.log" 2>&1 || true
        fi
        docker rm --force \
          "${OCTACITY_RELEASE_POSTGRES_CONTAINER:-octacity-console-postgres-not-started}" || true

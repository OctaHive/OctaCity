# The console has no browser credential or forwarded-identity contract. Keep
# those request headers out of the private management hop even if a caller
# supplies them, and replace upstream browser policy with the proxy policy.
proxy_set_header Authorization "";
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Remote-User "";
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Cache-Control;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Expires;
proxy_hide_header Permissions-Policy;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;

add_header Cache-Control $octacity_console_cache_control always;
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; worker-src 'none'" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# Only Vite-style content-hashed assets are immutable. Everything else,
# including index.html and management responses, must not be stored.
map $uri $octacity_console_cache_control {
    default "no-store";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
}

# API and health prefixes terminate at management. Their errors must never
# fall through to the SPA shell.
location = /api/v1 {
    proxy_pass http://octacity_management;
}

location ^~ /api/v1/ {
    proxy_pass http://octacity_management;
}

location = /health {
    proxy_pass http://octacity_management;
}

location ^~ /health/ {
    proxy_pass http://octacity_management;
}

# Static files either exist or return a real 404. Only extension-free browser
# routes may receive the SPA entry point.
location = / {
    try_files /index.html =404;
}

location = /index.html {
    try_files $uri =404;
}

location ^~ /assets/ {
    try_files $uri =404;
}

location ~ \.[^/]+$ {
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

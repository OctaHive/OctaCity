pid /run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /etc/nginx/octacity-console/cache-map.conf;

    server_tokens off;
    ssl_certificate /etc/octacity/tls/console.pem;
    ssl_certificate_key /etc/octacity/tls/console-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    # Keep this upstream on loopback or a protected proxy-only network.
    upstream octacity_management {
        server 127.0.0.1:8080;
    }

    server {
        listen 443 ssl;
        server_name console.internal.example.test;
        root /srv/octacity-console/current;
        index index.html;

        include /etc/nginx/octacity-console/security-headers.conf;
        include /etc/nginx/octacity-console/routes.conf;
    }
}

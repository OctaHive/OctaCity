pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Presigned object and cache URLs carry credentials in their query string.
    # Log only the normalized path, never $request, $request_uri, or $args.
    log_format safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout safe;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    ssl_certificate /run/secrets/gateway.pem;
    ssl_certificate_key /run/secrets/gateway-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    server {
        listen 8443 ssl default_server;
        server_name _;
        return 421;
    }

    server {
        listen 8443 ssl;
        server_name octacity.localhost;
        root /srv/octacity-ui;
        index index.html;

        location = /api/v1 {
            proxy_pass http://server:8080;
        }

        location ^~ /api/v1/ {
            proxy_pass http://server:8080;
        }

        location = /health {
            proxy_pass http://server:8080;
        }

        location ^~ /health/ {
            proxy_pass http://server:8080;
        }

        location = /metrics {
            proxy_pass http://server:8080;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 8443 ssl;
        server_name agent.localhost;

        location / {
            proxy_pass http://server:8081;
        }
    }

    server {
        listen 8443 ssl;
        server_name cache.localhost;
        # Nginx proxy warnings/errors may contain the complete signed request.
        # Keep process-critical diagnostics without exposing query credentials.
        error_log /dev/stderr crit;

        location / {
            proxy_pass http://server:8082;
        }
    }

    server {
        listen 8443 ssl;
        server_name objects.localhost;
        # Presigned object URLs are bearer credentials. Nginx error messages
        # cannot be given the safe access-log format and may include $request.
        error_log /dev/stderr crit;

        location / {
            # Omitting a proxy_pass URI preserves the original escaped path
            # and query string used by SigV4, while $http_host preserves the
            # exact signed Host header for host and Compose callers.
            proxy_pass http://minio:9000;
        }
    }
}

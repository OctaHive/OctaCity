# Factory-only loopback publication for native microVM clients. This listener
# has no Console or management route; Issue MCP always checks its own bearer.
# The existing gateway identity also authenticates the explicitly added microVM peer.
server {
    listen 8444 ssl;
    server_name _;
    error_log /dev/stderr crit;

    location = /mcp/issues {
        client_max_body_size 16k;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Remote-User "";
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
        proxy_pass http://octacity_management;
    }

    location / {
        return 404;
    }
}

[Service]
# systemd delegates the service cgroup while keeping the agent process in its
# own subgroup. The empty parent can therefore enable cpu, io, memory, and pids
# controllers for per-job children without granting access to sibling units.
Delegate=cpu io memory pids
DelegateSubgroup=agent
ProtectControlGroups=no
ReadWritePaths=/sys/fs/cgroup/system.slice/octacity-agent.service

version: 1

vars:
  CODEX_FIXTURE_PUBLIC: release-public-canary

tasks:
  cacheable:
    files:
      inputs:
        - server/tests/octacity-release-harness/fixtures/release-matrix/input/message.txt
      outputs:
        - server/tests/octacity-release-harness/fixtures/release-matrix/dist
        - server/tests/octacity-release-harness/fixtures/release-matrix/reports
    cache: {}
    artifacts:
      - name: release-result
        path: dist/performance.bin
        content_type: application/octet-stream
    reports:
      - name: release-junit
        path: reports/junit.xml
        format: junit
    shell: >-
      sleep 2 && mkdir -p dist reports && cp input/message.txt dist/message.txt &&
      head -c 1048576 /dev/urandom > dist/performance.bin &&
      printf '<testsuite name="release" tests="1" failures="0"/>\n' > reports/junit.xml &&
      echo 'release cache source ready at dist/message.txt'

  downstream:
    shell: echo 'release downstream build completed'

  failing:
    shell: echo 'release retry failure' >&2 && exit 23

  slow:
    shell: |
      sleep 120 &
      echo 'release cancellation process tree started'
      wait

  codex-fixture:
    vars:
      CODEX_FIXTURE_MODE: redaction
      CODEX_FIXTURE_SECRET:
        value: release-secret-canary-must-not-appear
        secret: true
      CODEX_FIXTURE_UNMAPPED:
        value: release-unmapped-canary-must-not-appear
        secret: true
    cmds:
      - id: codex
        codex:
          prompt: >-
            Execute the bounded release fixture. The prompt canary
            OCTACITY_CODEX_PROMPT_MUST_NOT_APPEAR_IN_TRACE must not be retained
            in the sanitized trace.
          result_schema:
            type: object
            properties:
              outcome: { const: completed }
              files: { const: 1 }
            required: [outcome, files]
            additionalProperties: false
          environment:
            public:
              OCTA_CODEX_FIXTURE_MODE: CODEX_FIXTURE_MODE
              OCTA_CODEX_FIXTURE_PUBLIC: CODEX_FIXTURE_PUBLIC
            secret:
              OCTA_CODEX_FIXTURE_SECRET: CODEX_FIXTURE_SECRET
          run_records: .octa/release-codex-runs
    outputs:
      outcome: { step: codex, field: outcome }

  codex-overflow:
    vars:
      CODEX_FIXTURE_MODE: overflow
      CODEX_FIXTURE_SECRET:
        value: release-secret-canary-must-not-appear
        secret: true
      CODEX_FIXTURE_UNMAPPED:
        value: release-unmapped-canary-must-not-appear
        secret: true
    cmds:
      - id: codex
        codex:
          prompt: Exercise the bounded release overflow fixture.
          environment:
            public:
              OCTA_CODEX_FIXTURE_MODE: CODEX_FIXTURE_MODE
              OCTA_CODEX_FIXTURE_PUBLIC: CODEX_FIXTURE_PUBLIC
            secret:
              OCTA_CODEX_FIXTURE_SECRET: CODEX_FIXTURE_SECRET
          run_records: .octa/release-codex-runs

  codex-cancel:
    vars:
      CODEX_FIXTURE_MODE: cancel
      CODEX_FIXTURE_SECRET:
        value: release-secret-canary-must-not-appear
        secret: true
      CODEX_FIXTURE_UNMAPPED:
        value: release-unmapped-canary-must-not-appear
        secret: true
    cmds:
      - id: codex
        codex:
          prompt: Exercise cancellation of the complete Codex process tree.
          environment:
            public:
              OCTA_CODEX_FIXTURE_MODE: CODEX_FIXTURE_MODE
              OCTA_CODEX_FIXTURE_PUBLIC: CODEX_FIXTURE_PUBLIC
            secret:
              OCTA_CODEX_FIXTURE_SECRET: CODEX_FIXTURE_SECRET
          run_records: .octa/release-codex-runs

[package]
name = "octacity-release-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Isolated released-bundle installer for the Agent Ready matrix"
default-run = "octacity-release-harness"

[[bin]]
name = "octacity-codex-fixture"
path = "src/bin/codex_fixture.rs"
test = false
bench = false
doc = false

[dependencies]
clap.workspace = true
octa-cache-protocol.workspace = true
octa-plugin-lock.workspace = true
octacity-protocol = { path = "../../../shared/octacity-protocol" }
octacity-private-fs = { path = "../../../agent/octacity-private-fs" }
octacity-runner = { path = "../../../agent/octacity-runner" }
octacity-server-job = { path = "../../core/octacity-server-job" }
octacity-source-plugin = { path = "../../../agent/octacity-source-plugin" }
octacity-vcs-protocol = { path = "../../protocols/octacity-vcs-protocol" }
octacity-webhook-provider-protocol = { path = "../../protocols/octacity-webhook-provider-protocol" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
rcgen.workspace = true
reqwest.workspace = true
rustls.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["fs"] }

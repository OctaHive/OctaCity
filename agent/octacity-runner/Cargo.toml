[package]
name = "octacity-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Octa runner inventory, protocol client, and supervisor for OctaCity"

[features]
# Exposes only bounded pure decoders to the out-of-workspace cargo-fuzz crate.
# Normal agent builds have no additional public protocol surface.
fuzzing = []

[dependencies]
base64.workspace = true
memchr.workspace = true
octa-runner-protocol.workspace = true
octa-cache-protocol.workspace = true
octa-plugin-lock.workspace = true
octacity-execution = { path = "../octacity-execution" }
octacity-protocol = { path = "../../shared/octacity-protocol" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true

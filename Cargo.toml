[workspace]
resolver = "3"
members = [
  "crates/octacity-agent",
  "crates/octacity-config",
  "crates/octacity-execution",
  "crates/octacity-execution-native",
  "crates/octacity-protocol",
  "crates/octacity-runner",
  "crates/octacity-source",
  "crates/octacity-source-git",
  "crates/octacity-source-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/OctaHive/OctaCity"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.5.47", features = ["derive"] }
ed25519-dalek = "2.2.0"
http = "1.3.1"
libc = "0.2.175"
octa-runner-protocol = { version = "0.3.0", path = "../octa/crates/octa-runner-protocol" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yml = "0.0.13"
sha2 = "0.10.9"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

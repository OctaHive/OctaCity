[workspace]
resolver = "3"
members = [
  "crates/octacity-agent",
  "crates/octacity-artifact-store",
  "crates/octacity-cache-session",
  "crates/octacity-config",
  "crates/octacity-coordinator",
  "crates/octacity-execution",
  "crates/octacity-execution-containerd",
  "crates/octacity-execution-microsandbox",
  "crates/octacity-execution-native",
  "crates/octacity-execution-oci",
  "crates/octacity-inventory",
  "crates/octacity-identity",
  "crates/octacity-job",
  "crates/octacity-lifecycle",
  "crates/octacity-output",
  "crates/octacity-phase6-contract-tests",
  "crates/octacity-private-fs",
  "crates/octacity-protocol",
  "crates/octacity-runner",
  "crates/octacity-source",
  "crates/octacity-source-git",
  "crates/octacity-source-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/OctaHive/OctaCity"

[workspace.dependencies]
async-trait = "0.1.89"
aws-sdk-s3 = { version = "1.146.1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "rustls"] }
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.5.47", features = ["derive"] }
containerd-client = "=0.9.0"
ed25519-dalek = "2.2.0"
http = "1.3.1"
libc = "0.2.175"
memchr = "2.7.6"
microsandbox = { version = "=0.6.18", default-features = false, features = ["net", "prebuilt"] }
octa-runner-protocol = { version = "0.3.0", path = "../octa/crates/octa-runner-protocol" }
octa-cache-protocol = { version = "0.3.0", path = "../octa/crates/octa-cache-protocol" }
octa-plugin-lock = { version = "0.3.0", path = "../octa/crates/octa-plugin-lock" }
prost = "0.14.3"
prost-types = "0.14.3"
processkit = { version = "=3.3.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yml = "0.0.13"
seccompiler = "0.5.0"
sha2 = "0.10.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"] }
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io", "rt"] }
tar = "0.4.46"
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
zeroize = "1.9.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

[workspace]
resolver = "3"
members = [
  "agent/octacity-agent",
  "agent/octacity-cache-session",
  "agent/octacity-config",
  "agent/octacity-coordinator",
  "agent/octacity-execution",
  "agent/octacity-execution-containerd",
  "agent/octacity-execution-microsandbox",
  "agent/octacity-execution-native",
  "agent/octacity-execution-oci",
  "agent/octacity-identity",
  "agent/octacity-inventory",
  "agent/octacity-job",
  "agent/octacity-lifecycle",
  "agent/octacity-output",
  "agent/octacity-private-fs",
  "agent/octacity-runner",
  "agent/octacity-source",
  "agent/octacity-source-git",
  "agent/octacity-source-plugin",
  "server/app/octacity-server",
  "server/api/octacity-server-api-agent",
  "server/api/octacity-server-api-rest",
  "server/api/octacity-server-api-webhook",
  "server/application/octacity-server-application",
  "server/core/octacity-artifact-store",
  "server/core/octacity-server-artifacts",
  "server/core/octacity-server-audit",
  "server/core/octacity-server-cache",
  "server/core/octacity-server-domain",
  "server/core/octacity-server-job",
  "server/core/octacity-server-orchestrator",
  "server/core/octacity-server-pipeline",
  "server/core/octacity-server-scheduler",
  "server/core/octacity-server-secrets",
  "server/core/octacity-server-store",
  "server/core/octacity-server-trigger",
  "server/infrastructure/octacity-artifact-s3",
  "server/infrastructure/octacity-server-store-postgres",
  "server/infrastructure/octacity-server-vcs",
  "server/infrastructure/octacity-server-webhook",
  "server/protocols/octacity-agent-provisioning-protocol",
  "server/protocols/octacity-vcs-protocol",
  "server/protocols/octacity-webhook-provider-protocol",
  "server/tests/octacity-phase6-contract-tests",
  "shared/octacity-observability",
  "shared/octacity-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/OctaHive/OctaCity"

[workspace.dependencies]
async-trait = "0.1.89"
aws-sdk-s3 = { version = "1.147.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio"] }
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.5.47", features = ["derive"] }
containerd-client = "=0.9.0"
ed25519-dalek = "2.2.0"
fs4 = "1.1.0"
http = "1.3.1"
libc = "0.2.175"
memchr = "2.7.6"
microsandbox = { version = "=0.6.18", default-features = false, features = ["net", "prebuilt"] }
octa-runner-protocol = { version = "0.4.0", path = "../octa/crates/octa-runner-protocol" }
octa-cache-protocol = { version = "0.4.0", path = "../octa/crates/octa-cache-protocol" }
octa-plugin-lock = { version = "0.4.0", path = "../octa/crates/octa-plugin-lock" }
prost = "0.14.3"
prost-types = "0.14.3"
processkit = { version = "=3.3.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml_ng = "0.10.0"
seccompiler = "0.5.0"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"] }
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io", "rt"] }
tower = "0.5.2"
tar = "0.4.46"
toml = "0.9.5"
tracing = "0.1.41"
tracing-layer-win-eventlog = "1.0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
windows-service = "0.8.1"
zeroize = "1.9.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
